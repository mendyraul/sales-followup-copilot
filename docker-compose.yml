name: sales-followup-demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sales_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: sales_followup
    ports:
      - "127.0.0.1:${DB_PORT:-5617}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_demo -d sales_followup"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
